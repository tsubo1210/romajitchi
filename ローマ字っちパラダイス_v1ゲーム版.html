<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ローマ字っちパラダイス</title><style>body{font-family:sans-serif;margin:0;background:linear-gradient(135deg,#7dd3fc,#f9a8d4)}.top{text-align:center;color:white;padding:10px}.panel{background:white;margin:10px;border-radius:18px;padding:12px}.btn{padding:10px 14px;border:none;border-radius:12px;margin:4px;background:#2563eb;color:#fff}.quizKana{font-size:22vw;text-align:center}.choices{position:fixed;bottom:20px;left:0;right:0;text-align:center}.choices button{font-size:24px;padding:12px;margin:4px}.egg{font-size:28px}.msg{font-size:36px;text-align:center;height:50px}.teach{background:#000;color:#fff;height:85vh;display:flex;align-items:center;justify-content:center;font-size:min(70vw,70vh);font-weight:bold}</style></head><body><div class='top'><h1>🌈ローマ字っちパラダイス</h1><div>⭐<span id=s>0</span> 🥚<span id=e>0</span>/5 📖<span id=d>0</span></div></div><div class='panel'><button class='btn' onclick='menu()'>🏠</button><button class='btn' onclick='teacherMenu()'>👨‍🏫授業</button><button class='btn' onclick='quiz()'>🎯クイズ</button><button class='btn' onclick='gacha()'>🎁ガチャ</button><button class='btn' onclick='dex()'>📖図鑑</button></div><div id='app' class='panel'></div><script>
const data=[['a','あ'],['i','い'],['u','う'],['e','え'],['o','お'],['ka','か'],['ki','き'],['ku','く'],['ke','け'],['ko','こ'],['sa','さ'],['shi','し'],['su','す'],['se','せ'],['so','そ'],['ta','た'],['chi','ち'],['tsu','つ'],['te','て'],['to','と'],['ga','が'],['gi','ぎ'],['gu','ぐ'],['ge','げ'],['go','ご'],['kya','きゃ'],['kyu','きゅ'],['kyo','きょ'],['sha','しゃ'],['shu','しゅ'],['sho','しょ']];
const chars=['ねこっち','いぬっち','うさっち','ぱんだっち','にんじゃっち','まほうっち','どらごんっち','ゆにこーんっち','にじっち'];
let stars=+localStorage.stars||0,egg=+localStorage.egg||0,found=JSON.parse(localStorage.found||'[]');
function save(){localStorage.stars=stars;localStorage.egg=egg;localStorage.found=JSON.stringify(found);s.textContent=stars;e.textContent=egg;d.textContent=found.length}
function menu(){app.innerHTML='<h2>ローマ字っちを集めよう！</h2><div class=egg>🥚 '+('▓'.repeat(egg)+'░'.repeat(5-egg))+'</div>'}
function teacherMenu(){app.innerHTML='<button class=btn onclick="startTeacher()">スタート</button><button class=btn onclick="document.documentElement.requestFullscreen()">⛶全画面</button>'}
let ti=0,side=0;function startTeacher(){app.innerHTML='<div id=t class=teach>a</div><button class=btn style="position:fixed;top:5px;right:5px" onclick="document.exitFullscreen&&document.exitFullscreen()">❌</button>';ti=0;side=0;t.onclick=function(){if(side==0){t.textContent=data[ti][1];side=1}else{ti=(ti+1)%data.length;t.textContent=data[ti][0];side=0}}}
function quiz(){let q=data[Math.floor(Math.random()*data.length)],a=q[0],opts=[a];while(opts.length<4){let r=data[Math.floor(Math.random()*data.length)][0];if(!opts.includes(r))opts.push(r)}opts.sort(()=>Math.random()-.5);app.innerHTML='<div id=m class=msg></div><div class=quizKana>'+q[1]+'</div><div class=choices>'+opts.map(x=>`<button onclick="ans('${x}','${a}')">${x}</button>`).join(' ')+'</div>'}
function ans(x,a){let m=document.getElementById('m');if(x==a){stars++;egg++;m.textContent='✅';if(egg>=5){egg=0;let c=chars[Math.floor(Math.random()*chars.length)];if(!found.includes(c))found.push(c);m.textContent='🎉 '+c+'誕生!';}save();}else{m.textContent='❌';}setTimeout(quiz,600)}
function gacha(){if(stars<5){app.innerHTML='<h2>⭐5こ必要！</h2>';return;}stars-=5;let c=chars[Math.floor(Math.random()*chars.length)];if(!found.includes(c))found.push(c);save();app.innerHTML='<h1>🎁</h1><h2>'+c+'ゲット！</h2>'}
function dex(){app.innerHTML='<h2>図鑑 '+found.length+'/9</h2>'+(found.length?found.join('<br>'):'まだいません');}
save();menu();
</script></body></html>
